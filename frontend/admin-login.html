<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow Admin • Portal Sign In</title>
  <meta name="description" content="Secure administrative authentication for TaskFlow." />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem('taskflow_admin_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>

  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --primary: #10b981;
      --primary-hover: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* ---------------- DARK THEME: Dark Background, Bright Light Text ---------------- */
    :root[data-theme="dark"] body {
      background-color: #060913;
      color: #f8fafc;
      background-image:
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    :root[data-theme="dark"] .login-container {
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.85), 0 0 40px rgba(16, 185, 129, 0.08);
      color: #f8fafc;
    }

    :root[data-theme="dark"] .login-title {
      color: #ffffff;
    }

    :root[data-theme="dark"] .login-subtitle {
      color: #94a3b8;
    }

    :root[data-theme="dark"] .form-label {
      color: #e2e8f0;
    }

    :root[data-theme="dark"] .form-input {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    :root[data-theme="dark"] .form-input::placeholder {
      color: #64748b;
    }

    :root[data-theme="dark"] .switch-link {
      color: #94a3b8;
    }

    :root[data-theme="dark"] .theme-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* ---------------- LIGHT THEME: Light Background, Deep Dark Text ---------------- */
    :root[data-theme="light"] body {
      background-color: #f8fafc;
      color: #0f172a;
      background-image:
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    :root[data-theme="light"] .login-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.08), 0 8px 30px rgba(16, 185, 129, 0.06);
      color: #0f172a;
    }

    :root[data-theme="light"] .login-title {
      color: #0f172a;
    }

    :root[data-theme="light"] .login-subtitle {
      color: #475569;
    }

    :root[data-theme="light"] .form-label {
      color: #1e293b;
    }

    :root[data-theme="light"] .form-input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }

    :root[data-theme="light"] .form-input::placeholder {
      color: #94a3b8;
    }

    :root[data-theme="light"] .switch-link {
      color: #475569;
    }

    :root[data-theme="light"] .theme-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    /* Ambient Orbs */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .glow-emerald {
      top: -120px;
      background: #10b981;
    }

    .glow-cyan {
      bottom: -120px;
      right: -100px;
      background: #06b6d4;
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(40px) scale(1.1);
      }
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      transform: scale(1.06);
      border-color: #10b981 !important;
      color: #10b981 !important;
    }

    /* Center Card */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 24px;
      padding: 44px 38px;
      border-radius: 24px;
      backdrop-filter: blur(24px);
      transition: all 0.3s ease;
      animation: cardEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Card Header */
    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #022c22;
      margin-bottom: 18px;
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.35);
    }

    .badge-restricted {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.25);
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: #64748b;
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 44px;
      border-radius: 12px;
      font-size: 14px;
      font-family: var(--font-main);
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3.5px rgba(16, 185, 129, 0.2);
    }

    .input-wrapper:focus-within .input-icon {
      color: #10b981;
    }

    /* Autofill overrides for perfect text and background contrast */
    :root[data-theme="dark"] .form-input:-webkit-autofill,
    :root[data-theme="dark"] .form-input:-webkit-autofill:hover,
    :root[data-theme="dark"] .form-input:-webkit-autofill:focus,
    :root[data-theme="dark"] .form-input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
      -webkit-text-fill-color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    :root[data-theme="light"] .form-input:-webkit-autofill,
    :root[data-theme="light"] .form-input:-webkit-autofill:hover,
    :root[data-theme="light"] .form-input:-webkit-autofill:focus,
    :root[data-theme="light"] .form-input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: #0f172a !important;
      border-color: #cbd5e1 !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .eye-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .eye-toggle-btn:hover {
      color: #10b981;
    }

    /* Alert */
    .alert-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .alert-box.hidden {
      display: none !important;
    }

    /* Submit Button */
    .submit-btn {
      position: relative;
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #022c22;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.01em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.48);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Link */
    .card-footer {
      text-align: center;
      margin-top: 26px;
    }

    .switch-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .switch-link:hover {
      color: #10b981;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .login-container {
        padding: 30px 20px;
        margin: 12px auto;
        border-radius: 18px;
        max-width: 100%;
      }
      .top-bar {
        top: 14px;
        right: 14px;
      }
      .ambient-glow {
        display: none;
      }
    }

    .switch-link:hover {
      color: #10b981 !important;
    }

    .switch-link svg {
      transition: transform 0.2s ease;
    }

    .switch-link:hover svg {
      transform: translateX(-3px);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 34px 22px;
        margin: 16px;
      }
    }
  </style>
</head>

<body>
  <!-- Ambient Lighting -->
  <div class="ambient-glow glow-emerald"></div>
  <div class="ambient-glow glow-cyan"></div>

  <!-- Theme Toggle -->
  <div class="top-bar">
    <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
      <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" />
      </svg>
    </button>
  </div>

  <!-- Login Card -->
  <main class="login-container">
    <div class="card-header">
      <div class="logo-icon-wrapper">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </div>
      <div>
        <span class="badge-restricted">Restricted Access</span>
      </div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Authenticate with your backend administrator credentials.</p>
    </div>

    <!-- Error Alert -->
    <div id="errorBox" class="alert-box hidden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="errorMsg">Authentication error</span>
    </div>

    <form id="adminLoginForm" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="adminEmail">Admin Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </span>
          <input type="email" id="adminEmail" class="form-input" placeholder="Admin Email Address" required
            autocomplete="email" spellcheck="false" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="adminPassword">Admin Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input type="password" id="adminPassword" class="form-input" placeholder="Admin Password" required
            autocomplete="current-password" />
          <button type="button" id="togglePwdBtn" class="eye-toggle-btn" aria-label="Toggle Password Visibility"
            tabindex="-1">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Authenticate &amp; Enter</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>
    </form>

    <div class="card-footer">
      <a href="http://localhost:5000" class="switch-link">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>Switch to User Portal</span>
      </a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
