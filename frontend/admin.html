<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard — TaskFlow</title>
    <meta name="description" content="Backend administrative overview, user accounts, and login telemetry." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/task.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('taskflow_admin_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root[data-theme="dark"] .standalone-admin {
        background: #080c14 !important;
        color: #f8fafc !important;
      }
      :root[data-theme="light"] .standalone-admin {
        background: #f8fafc !important;
        color: #0f172a !important;
      }
      
      /* Card Styles */
      :root[data-theme="light"] .admin-card-theme {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
        color: #0f172a !important;
      }
      :root[data-theme="dark"] .admin-card-theme {
        background: rgba(15, 23, 42, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        color: #f8fafc !important;
      }

      /* Text Contrast */
      :root[data-theme="light"] h1, 
      :root[data-theme="light"] h2, 
      :root[data-theme="light"] h3, 
      :root[data-theme="light"] .admin-heading {
        color: #0f172a !important;
      }
      :root[data-theme="dark"] h1, 
      :root[data-theme="dark"] h2, 
      :root[data-theme="dark"] h3, 
      :root[data-theme="dark"] .admin-heading {
        color: #ffffff !important;
      }

      :root[data-theme="light"] .admin-subtext {
        color: #475569 !important;
      }
      :root[data-theme="dark"] .admin-subtext {
        color: #94a3b8 !important;
      }

      /* Inputs in Admin Panel */
      :root[data-theme="light"] input,
      :root[data-theme="light"] select,
      :root[data-theme="light"] textarea {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
      }
      :root[data-theme="dark"] input,
      :root[data-theme="dark"] select,
      :root[data-theme="dark"] textarea {
        background: rgba(15, 23, 42, 0.75) !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        color: #ffffff !important;
      }

      /* Table Rows */
      :root[data-theme="light"] .admin-table-row {
        border-bottom: 1px solid #e2e8f0 !important;
        color: #0f172a !important;
      }
      :root[data-theme="dark"] .admin-table-row {
        border-bottom: 1px solid rgba(255, 255, 255, 0.07) !important;
        color: #f1f5f9 !important;
      }

      .standalone-admin {
        transition: background 0.3s ease, color 0.3s ease;
      }

      @media (max-width: 768px) {
        .standalone-admin header.topbar {
          flex-direction: column !important;
          align-items: flex-start !important;
          height: auto !important;
          padding: 12px 16px !important;
          gap: 12px !important;
        }
        .standalone-admin header.topbar > div:last-child {
          width: 100% !important;
          justify-content: space-between !important;
        }
        .standalone-admin main {
          padding: 16px 12px !important;
        }
        .standalone-admin .admin-card-theme {
          padding: 16px 12px !important;
          border-radius: 14px !important;
        }
        .standalone-admin table {
          min-width: 580px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="page" style="padding:var(--space-8)"><div class="skeleton" style="height:60vh;border-radius:var(--radius-xl)"></div></div></div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
